[bar.default]
position           = "top"
thickness          = 40
margin_edge        = 6
margin_ends        = 14
padding            = 0
widget_spacing     = 10
reserve_space      = true
background_opacity = 0.01
shadow             = false
compositor_blur    = false

capsule            = true
capsule_fill       = "surface_variant"
capsule_opacity    =  0.6
capsule_radius     = 14
capsule_thickness  = 0.9
capsule_padding    = 14

start  = ["arch", "group:tools", "workspaces", "media"]
center = ["clock"]
end    = ["group:apps", "group:status"]

[[bar.default.capsule_group]]
id             = "tools"
members        = ["launcher", "wallpaper"]
fill           = "surface_variant"
opacity        =  0.6
radius         = 14
padding        = 14
widget_spacing = 12

[[bar.default.capsule_group]]
id             = "status"
members        = ["tray", "notifications", "clipboard", "network", "volume", "session"]
fill           = "surface_variant"
opacity        =  0.6
radius         = 14
padding        = 14
widget_spacing = 12

# logo de Arch: pastilla cuadrada
[widget.arch]
capsule_padding = 9

# hora más ancha
[widget.clock]
capsule_padding = 28

# paneles flotantes
[shell.panel]
transparency_mode      = "soft"
control_center_placement = "floating"
wallpaper_placement      = "floating"
session_placement        = "floating"
floating_offset          = 8

# aplicaciones abiertas: un solo icono por app
[widget.taskbar]
group_by_workspace        = true
group_single_icon_per_app = true
show_workspace_label      = false
workspace_group_capsule   = false
show_active_indicator     = true

# clic derecho sobre las aplicaciones: selector de ventanas con vista previa
[widget.taskbar.actions]
right = "window-switcher"

[shell.window_switcher]
style                  = "compact"
current_workspace_only = false

# botón que abre el selector de ventanas con clic izquierdo
[widget.switcher]
type    = "custom_button"
glyph   = "layout-grid"
tooltip = "Ventanas abiertas"

[widget.switcher.actions]
left = "window-switcher"

[[bar.default.capsule_group]]
id             = "apps"
members        = ["taskbar", "switcher"]
fill           = "surface_variant"
opacity        = 0.6
radius         = 14
padding        = 14
widget_spacing = 12
