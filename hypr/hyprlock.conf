general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/wallpapers/aincrad.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# hora (horas arriba, minutos abajo)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H)"
    color = rgba(205, 214, 244, 1.0)
    font_size = 130
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +%M)"
    color = rgba(137, 180, 250, 1.0)
    font_size = 130
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 170
    halign = center
    valign = center
}

# fecha
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(166, 173, 200, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# imagen (logo o avatar)
image {
    monitor =
    path = ~/Pictures/profile/icon.jpg
    size = 100
    rounding = -1
    border_size = 2
    border_color = rgba(137, 180, 250, 1.0)
    position = 0, -30
    halign = center
    valign = center
}

# nombre de usuario
label {
    monitor =
    text = $USER
    color = rgba(205, 214, 244, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -110
    halign = center
    valign = center
}

# campo de contraseña
input-field {
    monitor =
    size = 280, 50
    rounding = 25
    outline_thickness = 2
    outer_color = rgba(137, 180, 250, 1.0)
    inner_color = rgba(30, 30, 46, 0.85)
    font_color = rgb(205, 214, 244)
    check_color = rgb(166, 227, 161)
    fail_color = rgb(243, 139, 168)
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="##6c7086">Contraseña</span>
    fail_text = <i>Incorrecta</i>
    position = 0, -180
    halign = center
    valign = center
}
